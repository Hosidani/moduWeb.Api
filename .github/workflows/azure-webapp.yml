# GitHub Actions workflow for deploying .NET Web API to Azure Web App
# Replace AZURE_WEBAPP_NAME and AZURE_RESOURCE_GROUP with your actual values

name: Deploy .NET Web API to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ModuWeb.Api/ModuWeb.Api.csproj

      - name: Build
        run: dotnet build ModuWeb.Api/ModuWeb.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ModuWeb.Api/ModuWeb.Api.csproj --configuration Release --output ModuWeb.Api/publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'moduwebapi-fccvbzccghd2h8am'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ModuWeb.Api/publish
